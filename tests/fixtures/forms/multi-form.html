<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Formvex generic multi-form fixture</title>
  </head>
  <body>
    <main>
      <h1>Generic multi-form fixture</h1>
      <form id="contact-form">
        <label for="full-name">Full name</label>
        <input id="full-name" name="full_name" type="text" required maxlength="120" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" />
        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>
        <label for="sector">Sector</label>
        <select id="sector" name="sector">
          <option value="">Choose one</option>
          <option value="engineering">Engineering</option>
        </select>
        <fieldset>
          <legend>Preferred contact</legend>
          <label><input type="radio" name="preferred_contact" value="email" /> Email</label>
          <label><input type="radio" name="preferred_contact" value="phone" /> Phone</label>
        </fieldset>
        <fieldset>
          <legend>Services</legend>
          <label><input type="checkbox" name="services" value="hosting" /> Hosting</label>
          <label><input type="checkbox" name="services" value="support" /> Support</label>
        </fieldset>
        <button type="submit">Send</button>
      </form>
      <form id="search-form">
        <label for="search">Search</label>
        <input id="search" name="search" type="search" />
        <input type="text" />
        <button type="submit">Search</button>
      </form>
    </main>
  </body>
</html>
