<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/build/formvex-ui.css" />
  </head>
  <body class="fv-app" data-sidebar-state="expanded">
    <button type="button" data-sidebar-open aria-controls="fv-sidebar" aria-expanded="false">
      Open navigation
    </button>
    <button type="button" data-theme-toggle>Theme: <span data-theme-label>Light</span></button>
    <div class="fv-sidebar-backdrop" data-sidebar-backdrop hidden></div>
    <aside id="fv-sidebar" class="fv-sidebar" aria-label="Primary navigation" data-sidebar>
      <button type="button" data-sidebar-close aria-label="Close navigation">
        Close navigation
      </button>
      <button
        type="button"
        data-sidebar-toggle
        aria-controls="fv-sidebar"
        aria-expanded="true"
        aria-label="Collapse navigation"
      >
        <span class="fv-sidebar-collapse-icon" data-sidebar-collapse-icon aria-hidden="true"
          >‹</span
        >
        <span class="fv-sidebar-collapse-label" data-sidebar-collapse-label
          >Collapse navigation</span
        >
      </button>
      <nav aria-label="Local Spoke">
        <a href="/formvex">Overview</a>
        <a href="/formvex/forms">Forms</a>
      </nav>
    </aside>
    <main id="main-content">
      <button type="button" data-discovery-dialog-open="test-discovery-dialog">Review field</button>
      <section
        class="fv-modal fv-discovery-dialog"
        id="test-discovery-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="test-discovery-dialog-title"
        data-discovery-dialog
      >
        <div class="fv-modal-panel">
          <header class="fv-modal-header">
            <h2 id="test-discovery-dialog-title">Review field</h2>
            <button type="button" data-modal-close aria-label="Close field review">×</button>
          </header>
          <div class="fv-modal-body">
            <label for="test-field-label">Display label</label>
            <input id="test-field-label" value="Email" />
          </div>
          <footer class="fv-modal-footer">
            <button type="button" data-modal-close>Done reviewing</button>
          </footer>
        </div>
      </section>
    </main>
    <script type="module" src="/build/spoke-admin.js"></script>
  </body>
</html>
